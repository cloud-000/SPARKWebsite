<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore SPARK chapters at local elementary schools in the Northshore School District.">
    <title>SPARK - Chapters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script src="../../src/index.js"></script>
    <script src="../../src/UI.js"></script>
    <script src="../../src/search.js"></script>
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="stylesheet" href="../../styles/chapters.css">

    <base href="/pages/">
</head>

<body>
    <navbar-component></navbar-component>

    <main class="container">
        <header class="page-header">
            <h1 class="title">Our Chapters</h1>
            <p class="description">These are the local schools we teach at.</p>
        </header>

        <div class="search">
            <input type="search" id="searchInput" placeholder="Search for a chapter..." aria-label="Search chapters">
            <div class="filter">
                <img src="../../styles/assets/icons/filter.png" alt="" id="filterIcon" role="button" tabindex="0" aria-label="Filter by location">

                <div class="tooltip" role="dialog" aria-label="Filter options">
                    <h2>Filter by Location</h2>
                    <label>
                        <input type="checkbox" name="location" value="united-states">
                        United States
                    </label>
                    <label>
                        <input type="checkbox" name="location" value="washington">
                        Washington
                    </label>
                    <label>
                        <input type="checkbox" name="location" value="n/a">
                        N/A
                    </label>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="directory-table" aria-label="SPARK chapter directory">
                <thead>
                    <tr>
                        <th scope="col">School</th>
                        <th scope="col">Country</th>
                        <th scope="col">State/Region</th>
                    </tr>
                </thead>
                <tbody class="directory-rows">
                    <tr class="directory-row" data-country="united states" data-region="washington">
                        <td><a href="https://canyoncreek.nsd.org/" target="_blank" rel="noopener noreferrer">Canyon Creek Elementary</a></td>
                        <td>United States</td>
                        <td>Washington</td>
                    </tr>
                    <tr class="directory-row" data-country="united states" data-region="washington">
                        <td><a href="https://fernwood.nsd.org/" target="_blank" rel="noopener noreferrer">Fernwood Elementary</a></td>
                        <td>United States</td>
                        <td>Washington</td>
                    </tr>
                    <tr class="directory-row" data-country="united states" data-region="washington">
                        <td><a href="https://cottagelake.nsd.org/" target="_blank" rel="noopener noreferrer">Wellington Elementary</a></td>
                        <td>United States</td>
                        <td>Washington</td>
                    </tr>
                    <tr class="directory-row" data-country="united states" data-region="washington">
                        <td><a href="https://woodin.nsd.org/" target="_blank" rel="noopener noreferrer">Woodin Elementary</a></td>
                        <td>United States</td>
                        <td>Washington</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer-component></footer-component>

</body>
</html>
